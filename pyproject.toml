[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amber-podcast"
version = "0.1.0"
description = "Amber Podcast: Self-hosted AI dual-track podcast service"
readme = "CONTEXT.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "edge-tts>=7.0.0",
    "mutagen>=1.47.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
