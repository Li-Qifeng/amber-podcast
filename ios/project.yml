name: AmberPodcast
options:
  bundleIdPrefix: com.refoxai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1" # iPhone
  ENABLE_PREVIEWS: YES
  GENERATE_INFOPLIST_FILE: NO

targets:
  AmberPodcast:
    type: application
    platform: iOS
    sources:
      - path: AmberPodcast
    info:
      path: AmberPodcast/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.refoxai.amberpodcast
      PRODUCT_NAME: "Amber 播客"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_STYLE: Automatic
    frameworks:
      - framework: SwiftUI.framework
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
      - framework: Combine.framework
