name: Build iOS Client (Amber Podcast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la AmberPodcast.xcodeproj

      - name: Build for Simulator & Capture Screenshots
        run: |
          cd ios
          mkdir -p screenshots
          
          # Select a simulator on the iOS 26 runtime, preferring the newest iPhone
          DEVICE_UUID=$(python3 "$GITHUB_WORKSPACE/.github/scripts/pick_simulator.py")
          if [ -z "$DEVICE_UUID" ]; then
            echo "No iPhone simulator available"
            exit 1
          fi
          echo "Selected Simulator UUID: $DEVICE_UUID"

          # Boot the simulator
          xcrun simctl boot "$DEVICE_UUID" || true
          
          # Build target specifically for the selected simulator architecture
          xcodebuild build \
            -project AmberPodcast.xcodeproj \
            -scheme AmberPodcast \
            -destination "id=$DEVICE_UUID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          
          # Locate built simulator .app
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*/Debug-iphonesimulator/*" | head -n 1)
          echo "Simulator App binary located at: $APP_PATH"
          
          # Install and launch in booted simulator
          xcrun simctl install "$DEVICE_UUID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast
          
          # Allow SwiftUI views and layout animations to complete
          sleep 6
          xcrun simctl io "$DEVICE_UUID" screenshot screenshots/home_screen.png

          # Relaunch with a seeded now-playing state so the mini player and the
          # shared glass field with the dock can be inspected
          xcrun simctl terminate "$DEVICE_UUID" com.refoxai.amberpodcast || true
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast -amberDemoPlaying
          sleep 6
          xcrun simctl io "$DEVICE_UUID" screenshot screenshots/miniplayer_state.png

          # Capture settings and the full player
          xcrun simctl terminate "$DEVICE_UUID" com.refoxai.amberpodcast || true
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast -amberStartTab 2 -amberDemoNowPlaying
          sleep 4
          xcrun simctl io "$DEVICE_UUID" screenshot screenshots/screen_settings.png

          xcrun simctl terminate "$DEVICE_UUID" com.refoxai.amberpodcast || true
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast -amberOpenPlayer -amberDemoNowPlaying
          sleep 4
          xcrun simctl io "$DEVICE_UUID" screenshot screenshots/screen_player.png

          # Capture the floating bubble (held open by a DEBUG hook)
          xcrun simctl terminate "$DEVICE_UUID" com.refoxai.amberpodcast || true
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast -amberDemoBubble
          sleep 5
          xcrun simctl io "$DEVICE_UUID" screenshot screenshots/dock_bubble.png

          # Burst-capture the dock while tabs cycle, so the selection transition
          # can be inspected frame by frame
          xcrun simctl terminate "$DEVICE_UUID" com.refoxai.amberpodcast || true
          xcrun simctl launch "$DEVICE_UUID" com.refoxai.amberpodcast -amberDemoTabs -amberSlowMotion -amberTraceIndicator
          sleep 3
          for i in $(seq -w 1 14); do
            xcrun simctl io "$DEVICE_UUID" screenshot "screenshots/tab_$i.png" > /dev/null 2>&1
          done

          ls -lh screenshots/

          # Dump the dock's liquid-lens trajectory recorded by the app
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_UUID" com.refoxai.amberpodcast data || true)
          echo "--- indicator trace (indicator x per frame) ---"
          if [ -n "$APP_DATA" ] && [ -f "$APP_DATA/Documents/indicator_trace.txt" ]; then
            cat "$APP_DATA/Documents/indicator_trace.txt"
          else
            echo "(no indicator trace produced)"
          fi

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmberPodcast-Screenshots
          path: ios/screenshots/
          retention-days: 7

      - name: Build Archive (Unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -project AmberPodcast.xcodeproj \
            -scheme AmberPodcast \
            -destination "generic/platform=iOS" \
            -archivePath build/AmberPodcast.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/AmberPodcast.xcarchive/Products/Applications/*.app build/Payload/
          python3 - <<'PY'
          import plistlib, glob, os, re
          m_ver, m_bld = '2.6.0', '1'
          if os.path.exists('project.yml'):
              with open('project.yml', 'r', encoding='utf-8') as f:
                  txt = f.read()
                  v = re.search(r'MARKETING_VERSION:\s*["\']?([^"\'\s]+)', txt)
                  b = re.search(r'CURRENT_PROJECT_VERSION:\s*["\']?([^"\'\s]+)', txt)
                  if v: m_ver = v.group(1)
                  if b: m_bld = b.group(1)

          plists = glob.glob('build/Payload/*.app/Info.plist')
          for p in plists:
              with open(p, 'rb') as f:
                  d = plistlib.load(f)
              d['CFBundleShortVersionString'] = m_ver
              d['CFBundleVersion'] = m_bld
              d['UILaunchScreen'] = {}
              d['UILaunchStoryboardName'] = 'LaunchScreen'
              d['UIBackgroundModes'] = ['audio', 'processing']
              d['UISupportedInterfaceOrientations'] = ['UIInterfaceOrientationPortrait']
              with open(p, 'wb') as f:
                  plistlib.dump(d, f)
              print(f'Verified and updated {p} with version {m_ver} (build {m_bld}).')
          PY
          cd build
          zip -r AmberPodcast.ipa Payload
          ls -lh AmberPodcast.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmberPodcast-iOS-IPA
          path: ios/build/AmberPodcast.ipa
          retention-days: 14

      - name: Trigger Automated AirStore Deployment
        if: success()
        run: |
          curl -s -X POST https://podcast.refoxai.com/api/v1/ci/deploy \
            -H "Content-Type: application/json" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}" \
            --max-time 15 || echo "AirStore deploy trigger sent"
