name: Build iOS Client (Amber Podcast)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la AmberPodcast.xcodeproj

      - name: Build Archive (Unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -project AmberPodcast.xcodeproj \
            -scheme AmberPodcast \
            -destination "generic/platform=iOS" \
            -archivePath build/AmberPodcast.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/AmberPodcast.xcarchive/Products/Applications/*.app build/Payload/
          python3 -c "
          import plistlib, glob
          plists = glob.glob('build/Payload/*.app/Info.plist')
          for p in plists:
              with open(p, 'rb') as f:
                  d = plistlib.load(f)
              d['UILaunchScreen'] = {}
              d['UILaunchStoryboardName'] = 'LaunchScreen'
              d['UIBackgroundModes'] = ['audio', 'processing']
              d['UISupportedInterfaceOrientations'] = ['UIInterfaceOrientationPortrait']
              with open(p, 'wb') as f:
                  plistlib.dump(d, f)
              print(f'Verified and updated {p} with full-screen UILaunchScreen support.')
          "
          cd build
          zip -r AmberPodcast.ipa Payload
          ls -lh AmberPodcast.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmberPodcast-iOS-IPA
          path: ios/build/AmberPodcast.ipa
          retention-days: 14
